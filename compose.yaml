services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer_dev_password
      POSTGRES_DB: volunteerconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer -d volunteerconnect"]
      interval: 3s
      timeout: 3s
      retries: 15
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://volunteer:volunteer_dev_password@db:5432/volunteerconnect
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
